org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false

# LiquidGlass for Bilibili（本机环境）：pub 缓存在 C:、工程在 E:，Kotlin 增量编译的
# 相对路径缓存会因「this and base files have different roots」而构建失败
# （:android_file_picker:compileDebugKotlin）。关掉增量编译即可绕开，代价只是 Kotlin 编译稍慢。
# CI（单盘符）不受影响，故这一行对上游流水线也无害。
kotlin.incremental=false
